; =========================================================
; Polybar — Minimalista, Alinhada & Funcional (Cyberdeck Q464B)
; Textos perfeitamente centralizados, sem clipping e com telemetria real.
; =========================================================

[colors]
bg = #0a0b0e
bg-alt = #181a24
fg = #e6dfd3
accent = #ff9e3b
muted = #70624e
alert = #ff4d4d

[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-bottom-size = 1
border-bottom-color = ${colors.muted}
padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "JetBrains Mono:size=9;1"

modules-left = i3
modules-center = date
modules-right = vpn network cpu temperature memory battery

tray-position = none
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state>

label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

label-urgent = %name%!
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = "%H:%M:%S"
date-alt = "%d/%m/%Y %H:%M:%S"
label = %date%
label-foreground = ${colors.accent}
label-padding = 1

[module/vpn]
type = custom/script
exec = ~/.config/i3/scripts/vpn-status.sh
interval = 3
format = <label>
format-padding = 1

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = <label-connected>
format-connected-prefix = "IP "
format-connected-prefix-foreground = ${colors.muted}
label-connected = %local_ip%
label-connected-foreground = ${colors.accent}
format-connected-padding = 1

format-disconnected = <label-disconnected>
label-disconnected = "IP OFF"
label-disconnected-foreground = ${colors.muted}
format-disconnected-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "CPU "
format-prefix-foreground = ${colors.muted}
label = %percentage%%
label-foreground = ${colors.fg}
format-padding = 1

format-warn = <label-warn>
format-warn-prefix = "CPU "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage%%!
format-warn-padding = 1

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format = <label>
format-prefix = "TEMP "
format-prefix-foreground = ${colors.muted}
label = %temperature-c%
label-foreground = ${colors.accent}
format-padding = 1

format-warn = <label-warn>
format-warn-prefix = "TEMP "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%!
format-warn-padding = 1

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "RAM "
format-prefix-foreground = ${colors.muted}
label = %percentage_used%%
label-foreground = ${colors.fg}
format-padding = 1

format-warn = <label-warn>
format-warn-prefix = "RAM "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage_used%%!
format-warn-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <label-charging>
format-charging-prefix = "BAT "
format-charging-prefix-foreground = ${colors.muted}
label-charging = "+%percentage%%"
label-charging-foreground = ${colors.accent}
format-charging-padding = 1

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.muted}
label-discharging = "%percentage%%"
label-discharging-foreground = ${colors.fg}
format-discharging-padding = 1

format-low = <label-low>
format-low-prefix = "BAT "
format-low-prefix-foreground = ${colors.alert}
label-low = "!%percentage%%"
label-low-foreground = ${colors.alert}
format-low-padding = 1

[settings]
screenchange-reload = true
