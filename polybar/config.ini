; =========================================================
; polybar — barra minimalista (Motion Plus Q464B)
; Mostra o essencial: workspace, CPU/RAM (hardware apertado,
; vale a pena monitorar), bateria, relógio.
; =========================================================

[colors]
bg = #0d1117
fg = #c9d1d9
accent = #39ff5c
muted = #6e7681
alert = #ff5555

[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrains Mono:size=11;3"

modules-left = i3
modules-center = date
modules-right = network cpu temperature memory battery

tray-position = none
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state>
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 5
date = "%H:%M"
date-alt = "%d/%m/%Y %H:%M:%S"
label = %date%
label-foreground = ${colors.fg}

[module/network]
type = internal/network
; IMPORTANTE: troque "wlan0" pelo nome real da sua interface —
; confirme com `ip link` (costuma ser algo como wlp2s0, wlan0, wlo1...)
interface = wlan0
interval = 3
format-connected = <label-connected>
label-connected = "wifi %essid%"
label-connected-foreground = ${colors.accent}
format-disconnected = <label-disconnected>
label-disconnected = "wifi off"
label-disconnected-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.muted}
label = %percentage%%
format-warn = <label-warn>
format-warn-foreground = ${colors.alert}
label-warn = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.muted}
label = %percentage_used%%
format-warn = <label-warn>
format-warn-foreground = ${colors.alert}
label-warn = RAM %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <label-charging>
format-charging-foreground = ${colors.accent}
label-charging = %percentage%%
format-discharging = <label-discharging>
label-discharging = %percentage%%
format-discharging-foreground = ${colors.fg}
format-low = <label-low>
format-low-foreground = ${colors.alert}
label-low = BAT %percentage%%

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format = <label>
format-prefix = "TEMP "
format-prefix-foreground = ${colors.muted}
label = %temperature-c%
label-foreground = ${colors.fg}
format-warn = <label-warn>
format-warn-prefix = "TEMP "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

[settings]
screenchange-reload = true
