; =========================================================
; Polybar — Minimalista & Funcional (Cyberdeck Q464B)
; Alto contraste, telemetria real e zero enfeites desnecessários.
; =========================================================

[colors]
bg = #0a0b0e
bg-alt = #161820
fg = #e6dfd3
accent = #ff9e3b
accent-dim = #a88144
muted = #615645
alert = #ff4d4d

[bar/main]
width = 100%
height = 26
offset-x = 0
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-size = 1
border-color = ${colors.accent-dim}
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrains Mono:size=9;2"

modules-left = i3
modules-center = date
modules-right = vpn network cpu temperature memory battery

tray-position = none
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state>

label-focused = "[%name%]"
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.accent}
label-focused-padding = 1

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1

label-urgent = "!%name%!"
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = "%d/%m/%Y %H:%M:%S"
label = "%date%"
label-foreground = ${colors.fg}

[module/vpn]
type = custom/script
exec = ~/.config/i3/scripts/vpn-status.sh
interval = 3
format = "<label> |"

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = "IP: <label-connected> |"
label-connected = "%local_ip%"
label-connected-foreground = ${colors.accent}
format-disconnected = "IP: OFF |"
format-disconnected-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU: "
format-prefix-foreground = ${colors.muted}
label = "%percentage%% |"
label-foreground = ${colors.fg}
format-warn = "CPU: <label-warn> |"
format-warn-foreground = ${colors.alert}
label-warn = "%percentage%%!"

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format-prefix = "TEMP: "
format-prefix-foreground = ${colors.muted}
label = "%temperature-c% |"
label-foreground = ${colors.accent}
format-warn = "TEMP: <label-warn> |"
format-warn-foreground = ${colors.alert}
label-warn = "%temperature-c%!"

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM: "
format-prefix-foreground = ${colors.muted}
label = "%percentage_used%% |"
label-foreground = ${colors.fg}
format-warn = "RAM: <label-warn> |"
format-warn-foreground = ${colors.alert}
label-warn = "%percentage_used%%!"

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = "BAT: +%percentage%%"
format-charging-foreground = ${colors.accent}
format-discharging = "BAT: %percentage%%"
format-discharging-foreground = ${colors.fg}
format-low = "BAT: !%percentage%%"
format-low-foreground = ${colors.alert}

[settings]
screenchange-reload = true
