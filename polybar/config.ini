; =========================================================
; Polybar — Tactical Amber HUD (Motion Plus Q464B Cyberdeck)
; Foco em Cybersec: Workspaces táticos, IP Local, VPN tun0,
; Temperatura (cooler da bateria), CPU, RAM e Bateria.
; =========================================================

[colors]
bg = #0d0e11
bg-alt = #16171d
fg = #e6dfd3
accent = #ff9e3b
accent-dim = #c49e68
muted = #70624e
alert = #ff4d4d

[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrains Mono:size=10;2"

modules-left = i3
modules-center = date
modules-right = vpn network cpu temperature memory battery

tray-position = none
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state>
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 5
date = "%H:%M"
date-alt = "%d/%m/%Y %H:%M:%S"
label = %date%
label-foreground = ${colors.accent-dim}

[module/vpn]
type = custom/script
exec = ~/.config/i3/scripts/vpn-status.sh
interval = 3
format = <label>

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = <label-connected>
label-connected = "NET %local_ip%"
label-connected-foreground = ${colors.accent-dim}
format-disconnected = <label-disconnected>
label-disconnected = "NET OFF"
label-disconnected-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.muted}
label = %percentage%%
format-warn = <label-warn>
format-warn-foreground = ${colors.alert}
label-warn = CPU %percentage%%

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format = <label>
format-prefix = "TEMP "
format-prefix-foreground = ${colors.muted}
label = %temperature-c%
label-foreground = ${colors.fg}
format-warn = <label-warn>
format-warn-prefix = "TEMP "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.muted}
label = %percentage_used%%
format-warn = <label-warn>
format-warn-foreground = ${colors.alert}
label-warn = RAM %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <label-charging>
format-charging-foreground = ${colors.accent}
label-charging = "BAT +%percentage%%"
format-discharging = <label-discharging>
label-discharging = "BAT %percentage%%"
format-discharging-foreground = ${colors.fg}
format-low = <label-low>
format-low-foreground = ${colors.alert}
label-low = "BAT !%percentage%%"

[settings]
screenchange-reload = true
