# =========================================================
# TLP — gerenciamento de energia (Motion Plus Q464B)
# Vai em /etc/tlp.d/ como arquivo extra — o TLP já vem com um
# /etc/tlp.conf padrão razoável, isso aqui só ajusta o que
# importa mais pra esse hardware específico (Atom fraco,
# bateria pequena, sem GPU dedicada pra se preocupar).
# =========================================================

# ---- CPU: prioriza economia, esse Atom não tem margem de
# performance sobrando de qualquer forma ----
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_BOOST_ON_AC=0
CPU_BOOST_ON_BAT=0

# ---- Wi-Fi: economia de energia (não afeta muito a velocidade
# no uso comum de faculdade — texto, PDFs, aulas online) ----
WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on

# ---- USB: autosuspend pra portas ociosas ----
USB_AUTOSUSPEND=1

# ---- disco (eMMC não tem muito o que ajustar, mas não custa) ----
DISK_IOSCHED="mq-deadline"

# ---- desliga o áudio integrado quando ocioso (economia real,
# sem impacto perceptível) ----
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1

# ---- PCIe ASPM: modo mais econômico ----
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Nota: não incluí limite de carga da bateria (STOP_CHARGE_THRESH) —
# esse recurso depende de suporte de hardware específico (comum em
# ThinkPad/Yoga) que esse Motion Plus provavelmente não tem. Se rodar
# `tlp-stat -b` e aparecer suporte, me avise que a gente adiciona.
