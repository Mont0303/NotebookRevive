# =========================================================
# starship — Tactical Amber Prompt (Cyberdeck Q464B)
# =========================================================

format = """
[$username](bold #ff9e3b)[@](#70624e)[$hostname](#c49e68)[:](#70624e)[$directory](bold #ffb454)$git_branch$git_status$cmd_duration
$character"""

[username]
style_user = "bold #ff9e3b"
style_root = "bold #ff4d4d"
format = "[$user]($style)"
show_always = true
disabled = false

[hostname]
format = "[$hostname]($style)"
style = "#c49e68"
disabled = false

[directory]
style = "bold #ffb454"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
style = "#ff9e3b"
format = "[($branch)]($style) "

[git_status]
style = "#c49e68"
format = "[$all_status]($style) "

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "#c49e68"

[character]
success_symbol = "[>](bold #ff9e3b)"
error_symbol = "[!](bold #ff4d4d)"
vimcmd_symbol = "[<](bold #ff9e3b)"

[battery]
disabled = false
format = "[$percentage$symbol]($style) "
charging_symbol = "[+]"
discharging_symbol = "[-]"
