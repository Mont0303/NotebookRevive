[greeter]
background = /usr/share/lightdm-gtk-greeter/matrix-q464b/background.png
theme-name = matrix-q464b-lightdm
icon-theme-name = Adwaita
font-name = JetBrains Mono 10
xft-antialias = true
xft-hintstyle = slight

indicators = ~spacer;~clock;~spacer;~session;~power

clock-format = %H:%M
position = 50%,center 50%,center

hide-user-image = true
default-user-image = #
