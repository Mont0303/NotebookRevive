# =========================================================
# MPV Config — Otimizado para Intel Atom x5-Z8350 (Cherry Trail)
# Aceleração VA-API + Forçar H.264 (AVC) para evitar lag de CPU
# =========================================================

# Decodificação de hardware pela GPU integrada (Intel Gen8)
hwdec=vaapi
vo=gpu
gpu-context=x11egl

# FORÇA H.264 (AVC1) no YouTube e streaming
# O Atom Z8350 NÃO tem suporte a VP9/AV1 na GPU!
# Este filtro faz o yt-dlp selecionar somente streams em H.264 (até 1080p ou 720p)
ytdl-format="bestvideo[vcodec^=avc1][height<=1080]+bestaudio/best[vcodec^=avc1][height<=720]/best"

# Reduz uso de RAM e consumo de memória
cache=yes
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=20MiB

# Estilo Cyberdeck no OSD (verde #39ff5c e JetBrains Mono)
osd-font="JetBrains Mono"
osd-font-size=22
osd-color="#39ff5c"
osd-border-color="#0d1117"
osd-border-size=2
osd-bar-align-y=0.9
osd-bar-h=2
osd-bar-w=60

# Configurações de janela
autofit=80%x80%
geometry=50%:50%
keep-open=yes
