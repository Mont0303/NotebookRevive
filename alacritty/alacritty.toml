# =========================================================
# Alacritty — Tactical Amber HUD (Motion Plus Q464B Cyberdeck)
# =========================================================

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 8 }
opacity = 0.98
decorations = "none"

[font]
size = 10.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

# ---- Paleta Tactical Amber ----
[colors.primary]
background = "#0d0e11"
foreground = "#e6dfd3"

[colors.cursor]
text = "#0d0e11"
cursor = "#ff9e3b"

[colors.selection]
text = "#0d0e11"
background = "#ff9e3b"

[colors.normal]
black   = "#14151a"
red     = "#ff4d4d"
green   = "#73b06f"
yellow  = "#ff9e3b"
blue    = "#56949f"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#e6dfd3"

[colors.bright]
black   = "#3d352a"
red     = "#ff6e6e"
green   = "#98d694"
yellow  = "#ffb454"
blue    = "#76b4bf"
magenta = "#caa9d1"
cyan    = "#a3dbe8"
white   = "#f6f2ec"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#ff9e3b"

[scrolling]
history = 10000